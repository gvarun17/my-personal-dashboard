# SonarCloud settings. The organization and project keys come from
# sonarcloud.io after importing the repo (check them there).
sonar.organization=gvarun17
sonar.projectKey=gvarun17_my-personal-dashboard
sonar.projectName=my-personal-dashboard

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.10,3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Make the PR check fail when Sonar's quality gate fails.
sonar.qualitygate.wait=true
