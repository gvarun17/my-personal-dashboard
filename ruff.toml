# Python lint settings (ruff). The project supports Python 3.10+.
target-version = "py310"

[lint]
# Listed explicitly so a ruff update can't silently add new rules:
# pycodestyle errors (E4, E7, E9), pyflakes (F: unused names, undefined
# names...), bugbear (B: likely bugs) and bandit-style security checks (S).
select = ["E4", "E7", "E9", "F", "B", "S"]

[lint.per-file-ignores]
# Tests use assert-style helpers, fake keys and local subprocesses on purpose.
"tests/**" = ["S"]
