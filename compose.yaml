# docker compose up -d --build   ->   http://localhost:8080
services:
  dashboard:
    build: .
    image: my-personal-dashboard:latest
    container_name: garmin-dashboard
    restart: unless-stopped
    # Optional: settings in .env.local (never committed). Without it, open the
    # app and the start page asks for your name, time zone and Garmin key.
    env_file:
      - path: .env.local
        required: false
    environment:
      GARMIN_DATA_DIR: /data
    ports:
      # Only this computer can open it. To open it from your phone on the same
      # Wi-Fi, change to "8080:8080" AND set DASHBOARD_PASSWORD (see README).
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - garmin-data:/data

volumes:
  garmin-data:
