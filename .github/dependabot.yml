# Weekly update PRs for the CI tools, the Docker base image and the test tools,
# so security fixes arrive without having to watch for them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-tools: { patterns: ["*"] }
