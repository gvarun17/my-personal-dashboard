# Checks that run on every pull request into main. A PR should only be merged
# when all of them pass (see "Pull request checks" in README.md).
#
# Actions are pinned to a full commit SHA (the version is in the comment) so a
# changed tag can't swap in different code. Dependabot keeps them up to date.
name: PR checks

on:
  pull_request:
    branches: [main]

# Every job can only read the repo, unless it says otherwise below.
permissions:
  contents: read

# A newer push to the same PR cancels the older, now-outdated run.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: python -m coverage run -m unittest discover -s tests -t . -v
      - name: Coverage report (must be 100%)
        run: python -m coverage report

  lint:
    name: Lint (ruff, hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install lint tools
        run: python -m pip install -r requirements-dev.txt
      - name: Python (ruff)
        run: python -m ruff check --output-format=github src tests
      - name: Dockerfile (hadolint)
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint:v2.15.1 < Dockerfile

  sonarcloud:
    name: SonarCloud (quality and security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs the history to tell which code is new
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Tests with coverage report for Sonar
        run: |
          python -m coverage run -m unittest discover -s tests -t .
          python -m coverage xml
      - name: Check the Sonar token is set up
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is not set. Add it under Settings > Secrets and variables > Actions (see README)."
            exit 1
          fi
      - name: SonarCloud scan (fails when the quality gate fails)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write # to report what it finds in the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not just the latest
          persist-credentials: false
      - name: Look for keys, tokens and passwords in the history
        run: |
          # safe.directory: the checkout belongs to a different user than the scanner
          docker run --rm -v "$PWD/.git:/repo/.git:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --verbose

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  app:
    name: App build, run and image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t my-personal-dashboard:ci .
      - name: Start it like a fresh install
        run: docker run -d --name dash -p 8080:8080 -e REFRESH_MINUTES=0 my-personal-dashboard:ci
      - name: Check the app works
        run: |
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          echo "- health check answers";  curl -fsS http://localhost:8080/healthz >/dev/null
          echo "- status page answers";   curl -fsS http://localhost:8080/status >/dev/null
          echo "- fresh install opens the start page"
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:8080/)" = "303 http://localhost:8080/setup"
          curl -fsS http://localhost:8080/setup | grep -q 'Garmin'
          echo "- setup form refuses posts from other sites"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' -d 'name=x' http://localhost:8080/setup)" = "403"
          echo "- setup form accepts the page's own post, sent the way browsers send it"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: null' -H 'Sec-Fetch-Site: same-origin' -d 'name=' http://localhost:8080/setup)" = "400"
          curl -sI http://localhost:8080/setup | grep -qi '^referrer-policy: same-origin'
          echo "- runs as the non-root app user, with no .env.local inside"
          docker exec dash sh -c 'test "$(id -u)" = 10001 && test ! -e /app/.env.local'
          echo "- Docker reports it healthy"
          for _ in $(seq 1 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' dash)" = healthy ] && break; sleep 3; done
          test "$(docker inspect -f '{{.State.Health.Status}}' dash)" = healthy
      - name: App logs
        if: always()
        run: docker logs dash || true
      - name: Vulnerability scan of the image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress --skip-version-check \
            my-personal-dashboard:ci
